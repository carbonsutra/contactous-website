openapi: 3.0.3
info:
  title: Contactous Product APIs
  version: 1.0.0
  description:
    Illustrative API catalogue for Contactous products. Demo endpoints and schemas are placeholders
    for documentation/UI development; confirm real production endpoints with the product team.
  contact:
    name: Contactous
    email: support@Contactous.com
    url: https://Contactous.com
servers:
  - url: https://api.example.com
    description: Placeholder server — configure API_URL
tags:
  - name: Contactous
    description: Unified APIs for carbon intelligence, sustainability metrics, and environmental data.
  - name: 2Markdown
    description:
      Convert web pages and documents into clean Markdown for search, knowledge bases, and AI
      workflows.
  - name: Scholia
    description:
      Research-paper processing and scholarly knowledge extraction for publishers, educators,
      and research teams.
  - name: Assessments
    description: Build structured assessments, score submissions, and turn responses into useful insights.
  - name: Airports & Location Intelligence
    description:
      Airport lookup, proximity, distance, and location-aware data services for travel and logistics
      applications.
  - name: Clustering
    description: Group records and organize related information with configurable clustering APIs.
  - name: ContentWeaver
    description: Prepare, transform, and orchestrate content for downstream applications and AI pipelines.
  - name: DeDuplication
    description: Identify duplicate and near-duplicate records to improve data quality and reduce repetition.
  - name: Answerous
    description: Turn knowledge sources into clear, grounded answers for information and support workflows.
  - name: Gaming
    description: APIs and data utilities for game experiences, player workflows, and interactive applications.
  - name: Categorization
    description: Classify and label incoming text or records into consistent categories.
  - name: Stylos
    description:
      Analyze text and documents for authorship signals with explainable, structured analysis
      results.
