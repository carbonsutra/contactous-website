components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  schemas:
    DemoRequest:
      type: object
      required:
        - input
      properties:
        request_id:
          type: string
          example: demo-001
        input:
          type: string
          example: sample input
        options:
          type: object
          additionalProperties: true
    DemoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              example: demo-result-001
            product:
              type: string
            status:
              type: string
              example: completed
            result:
              type: string
              example: Illustrative result
            confidence:
              type: number
              example: 0.94
        request_id:
          type: string
          example: demo-001
